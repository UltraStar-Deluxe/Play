options_songLibrary_helpDialog_title=Song Info
options_songLibrary_helpDialog_songFormatInfo_title=UltraStar Song Format
options_songLibrary_helpDialog_songFormatInfo=An UltraStar song consists of\n• an audio file (.mp3, .ogg, .mid, etc.)\n• a plain text file (.txt file) with information about the song (title, lyrics, notes, path to audio file, etc.)\n• optionally, files for cover image, background image, or background video.
options_songLibrary_helpDialog_midiSongFormatInfo_title=MIDI Format
options_songLibrary_helpDialog_midiSongFormatInfo=A MIDI file (.mid file) contains information about notes to be played and optionally their lyrics.\nA MIDI file can be used as an alternative to regular audio files such as mp3 and ogg.\nA MIDI file with lyrics (.mid or .kar file) can be used as alternative to the UltraStar song format.
options_songLibrary_helpDialog_addSongInfo_title=Adding Songs
options_songLibrary_helpDialog_addSongInfo=Here you can\n• add a new folder that points to your existing songs in UltraStar or MIDI format\n• or download an archive (ZIP or TAR file) with songs from the internet.
options_songLibrary_helpDialog_createSongInfo_title=Creating UltraStar Songs
options_songLibrary_helpDialog_createSongInfo=You can create your own UltraStar songs with the integrated editor of Melody Mania.
options_songLibrary_helpDialog_downloadSongInfo_title=Downloading UltraStar Songs
options_songLibrary_helpDialog_downloadSongInfo=There are some demo songs under Creative Commons license that can be downloaded here.\nHowever, there is no official platform yet to share UltraStar songs.
options_songLibrary_helpDialog_androidSongFolders_title=Song Folders on Android
options_songLibrary_helpDialog_androidSongFolders=Android limits file access for security reasons. Thus, songs must be stored in the folder {androidAppSpecificStorageRelativePath}.
options_songLibrary_helpDialog_songsWithoutSingAlongDataInfo_title=Search Songs Without Sing-Along Data
options_songLibrary_helpDialog_songsWithoutSingAlongDataInfo=When this option is enabled then\n• Audio files without corresponding UltraStar txt file are searched and shown during song select.\n• When trying to start a song without sing-along data then the game will ask to create it using AI tools.\n• Note however that the AI tools are not perfect (yet) such that manual adjustments of lyrics and note positions may still be required.
